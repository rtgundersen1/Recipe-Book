<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Recipe Book</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-green: #22c55e;
      --btn-red: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 80px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .sync-bar {
      display: flex;
      gap: 8px;
    }
    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      opacity: 0.7;
    }
    button.primary {
      background: var(--accent);
      color: #0f172a;
      border: none;
    }
    .recipe-select-box {
      margin-bottom: 16px;
    }
    select, input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .servings-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .servings-bar label {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .servings-bar input {
      width: 80px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .macro-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
    }
    .macro-card span.label {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .macro-card span.val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
    }
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--text-muted);
      font-weight: 600;
    }
    td input.weight-input {
      width: 65px;
      padding: 6px;
      font-size: 0.85rem;
      text-align: right;
    }
    .del-btn {
      color: var(--btn-red);
      background: transparent;
      border: none;
      font-size: 1rem;
      padding: 4px 8px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .sync-status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
    /* Settings Modal */
    #settingsModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Recipe Book</h1>
    <div class="sync-bar">
      <button onclick="syncWithDrive()">Sync</button>
      <button onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <div class="recipe-select-box">
    <select id="recipeSelect" onchange="loadSelectedRecipe()">
      <!-- Recipes populated dynamically -->
    </select>
  </div>

  <div class="servings-bar">
    <label for="servingsInput">Number of Servings:</label>
    <input type="number" id="servingsInput" min="1" step="1" value="1" oninput="updateCalculations()">
  </div>

  <div class="macro-grid">
    <div class="macro-card">
      <span class="label">Cals / Serv</span>
      <span class="val" id="disp-calories">0</span>
    </div>
    <div class="macro-card">
      <span class="label">Prot / Serv</span>
      <span class="val" id="disp-protein">0g</span>
    </div>
    <div class="macro-card">
      <span class="label">Carb / Serv</span>
      <span class="val" id="disp-carbs">0g</span>
    </div>
    <div class="macro-card">
      <span class="label">Fat / Serv</span>
      <span class="val" id="disp-fat">0g</span>
    </div>
  </div>

  <div class="section-title">Batch Ingredients (Raw Weight)</div>
  <div class="table-container">
    <table id="ingredientsTable">
      <thead>
        <tr>
          <th>Ingredient</th>
          <th style="text-align: right;">Grams</th>
          <th style="width: 30px;"></th>
        </tr>
      </thead>
      <tbody id="ingredientsBody">
        <!-- Rows populated dynamically -->
      </tbody>
    </table>
  </div>

  <div class="btn-row">
    <button onclick="addIngredientRow()">+ Add Ingredient</button>
    <button class="primary" onclick="saveCurrentRecipe()">Save Recipe</button>
    <button onclick="createNewRecipePrompt()">+ New Recipe</button>
  </div>

  <div class="sync-status" id="syncStatus">Local cache active</div>

  <!-- Settings Modal for Google Apps Script Webhook URL -->
  <div id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Webhook Settings</h3>
      <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">
        Google Apps Script Web App URL:
      </label>
      <input type="url" id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec" style="margin-bottom: 16px;">
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button onclick="closeSettings()">Cancel</button>
        <button class="primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Master Ingredient Database per 100g
    const FOOD_DB = {
      "Canned Chicken Breast (Drained)": { cal: 110, p: 24, c: 0, f: 1.5 },
      "Nonfat Greek Yogurt (Plain)": { cal: 59, p: 10, c: 3.6, f: 0.4 },
      "White Rice (Cooked)": { cal: 130, p: 2.7, c: 28, f: 0.3 },
      "Black Beans (Drained/Rinsed)": { cal: 132, p: 8.9, c: 23.7, f: 0.5 },
      "Frank's RedHot Sauce": { cal: 0, p: 0, c: 0, f: 0 },
      "Ranch Seasoning Mix": { cal: 280, p: 0, c: 56, f: 0 },
      "Garlic Powder": { cal: 331, p: 17, c: 73, f: 0.7 },
      "Olive Oil": { cal: 884, p: 0, c: 0, f: 100 }
    };

    // Default Seed Recipes
    let recipesData = [
      {
        id: "buffalo-chicken-bowl",
        name: "Buffalo Chicken Rice Bowl",
        servings: 1,
        ingredients: [
          { name: "Canned Chicken Breast (Drained)", weight: 200 },
          { name: "White Rice (Cooked)", weight: 150 },
          { name: "Black Beans (Drained/Rinsed)", weight: 80 },
          { name: "Nonfat Greek Yogurt (Plain)", weight: 85 },
          { name: "Frank's RedHot Sauce", weight: 30 },
          { name: "Ranch Seasoning Mix", weight: 4 },
          { name: "Garlic Powder", weight: 2 }
        ]
      }
    ];

    let currentRecipeIndex = 0;

    // Local Storage Management
    function initData() {
      const saved = localStorage.getItem("recipe_book_data");
      if (saved) {
        try { recipesData = JSON.parse(saved); } catch (e) {}
      }
      populateRecipeDropdown();
      loadSelectedRecipe();
    }

    function populateRecipeDropdown() {
      const select = document.getElementById("recipeSelect");
      select.innerHTML = "";
      recipesData.forEach((r, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = r.name;
        select.appendChild(opt);
      });
      select.value = currentRecipeIndex;
    }

    function loadSelectedRecipe() {
      const select = document.getElementById("recipeSelect");
      currentRecipeIndex = parseInt(select.value) || 0;
      const recipe = recipesData[currentRecipeIndex];
      
      document.getElementById("servingsInput").value = recipe.servings || 1;
      
      const tbody = document.getElementById("ingredientsBody");
      tbody.innerHTML = "";

      recipe.ingredients.forEach((ing, i) => {
        addIngredientRow(ing.name, ing.weight);
      });

      updateCalculations();
    }

    function addIngredientRow(name = "", weight = 100) {
      const tbody = document.getElementById("ingredientsBody");
      const tr = document.createElement("tr");

      // Build options
      let optionsHtml = `<option value="">-- Select or Type Custom --</option>`;
      for (const item in FOOD_DB) {
        const selected = item === name ? "selected" : "";
        optionsHtml += `<option value="${item}" ${selected}>${item}</option>`;
      }

      tr.innerHTML = `
        <td>
          <select onchange="updateCalculations()" style="padding: 6px; font-size: 0.85rem;">
            ${optionsHtml}
          </select>
        </td>
        <td style="text-align: right;">
          <input type="number" class="weight-input" value="${weight}" step="1" min="0" oninput="updateCalculations()">
        </td>
        <td style="text-align: center;">
          <button class="del-btn" onclick="removeRow(this)">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
      updateCalculations();
    }

    function removeRow(btn) {
      btn.closest("tr").remove();
      updateCalculations();
    }

    function updateCalculations() {
      const rows = document.querySelectorAll("#ingredientsBody tr");
      const servings = Math.max(1, parseFloat(document.getElementById("servingsInput").value) || 1);

      let batchCal = 0;
      let batchP = 0;
      let batchC = 0;
      let batchF = 0;

      rows.forEach(r => {
        const select = r.querySelector("select");
        const weightInput = r.querySelector("input.weight-input");
        const item = select.value;
        const grams = parseFloat(weightInput.value) || 0;

        if (FOOD_DB[item]) {
          const ratio = grams / 100;
          batchCal += FOOD_DB[item].cal * ratio;
          batchP   += FOOD_DB[item].p * ratio;
          batchC   += FOOD_DB[item].c * ratio;
          batchF   += FOOD_DB[item].f * ratio;
        }
      });

      // Pure Macros Per Serving
      document.getElementById("disp-calories").textContent = Math.round(batchCal / servings);
      document.getElementById("disp-protein").textContent  = (batchP / servings).toFixed(1) + "g";
      document.getElementById("disp-carbs").textContent    = (batchC / servings).toFixed(1) + "g";
      document.getElementById("disp-fat").textContent      = (batchF / servings).toFixed(1) + "g";
    }

    function saveCurrentRecipe() {
      const recipe = recipesData[currentRecipeIndex];
      recipe.servings = Math.max(1, parseFloat(document.getElementById("servingsInput").value) || 1);
      
      const rows = document.querySelectorAll("#ingredientsBody tr");
      recipe.ingredients = [];

      rows.forEach(r => {
        const select = r.querySelector("select");
        const weightInput = r.querySelector("input.weight-input");
        if (select.value) {
          recipe.ingredients.push({
            name: select.value,
            weight: parseFloat(weightInput.value) || 0
          });
        }
      });

      localStorage.setItem("recipe_book_data", JSON.stringify(recipesData));
      document.getElementById("syncStatus").textContent = "Recipe saved locally at " + new Date().toLocaleTimeString();
    }

    function createNewRecipePrompt() {
      const name = prompt("Enter new recipe name:");
      if (!name) return;
      recipesData.push({
        id: "recipe-" + Date.now(),
        name: name,
        servings: 1,
        ingredients: []
      });
      currentRecipeIndex = recipesData.length - 1;
      localStorage.setItem("recipe_book_data", JSON.stringify(recipesData));
      populateRecipeDropdown();
      loadSelectedRecipe();
    }

    // Google Apps Script Cloud Sync
    async function syncWithDrive() {
      const webhookUrl = localStorage.getItem("gas_webhook_url");
      const status = document.getElementById("syncStatus");

      if (!webhookUrl) {
        alert("Please set your Google Apps Script Webhook URL in Settings (⚙️) first.");
        openSettings();
        return;
      }

      status.textContent = "Syncing with Google Drive...";
      saveCurrentRecipe();

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "save_recipes",
            payload: recipesData
          })
        });
        
        status.textContent = "Sync successful: " + new Date().toLocaleTimeString();
      } catch (err) {
        console.error(err);
        status.textContent = "Sync error. Check webhook URL & permissions.";
      }
    }

    function openSettings() {
      document.getElementById("webhookInput").value = localStorage.getItem("gas_webhook_url") || "";
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }

    function saveSettings() {
      const url = document.getElementById("webhookInput").value.trim();
      localStorage.setItem("gas_webhook_url", url);
      closeSettings();
    }

    window.onload = initData;
  </script>
</body>
</html>
